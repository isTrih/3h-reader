name: Publish Docker image

on:
  release:
    types: [published]

concurrency:
  group: publish-docker-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: trihlp

jobs:
  publish:
    name: Build and publish from release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          expected_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$expected_commit" ]]; then
            echo "::error::Checkout commit $actual_commit does not match release tag commit $expected_commit"
            exit 1
          fi

          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          release_version="${RELEASE_TAG#v}"
          if [[ "$release_version" != "$cargo_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Resolve lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: echo "name=${DOCKERHUB_USERNAME,,}/${REPOSITORY_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ !startsWith(github.event.release.tag_name, 'v0.') }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=sha,prefix=sha-

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=3h-reader
          cache-to: type=gha,mode=max,scope=3h-reader
