[package]
name = "openlark-bitable-service"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
openlark = { git = "https://github.com/foxzool/openlark", tag = "v0.20.0", version = "0.20.0", default-features = false, features = ["auth", "docs-full", "websocket"] }
salvo = { version = "0.94.0", features = ["affix-state", "catch-panic", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
salvo = { version = "0.94.0", features = ["test"] }
